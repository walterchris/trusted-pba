# Virtual CI — runs on every PR, no hardware (compliance baseline §18).
# NOTE: lint and qemu-smoke are real; the other jobs are SKELETON placeholders
# (clearly named) that their tracked issues (#9 + phase issues) replace with real
# implementations. They intentionally do nothing yet.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: policy parser fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./internal/policy
      - name: opal response parser fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzResponseParse -fuzztime=30s ./internal/opal

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: static analysis (placeholder)
        run: |
          echo "TODO: govulncheck + staticcheck/gosec; upload to evidence/sast-reports/"

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependency + license scan (placeholder)
        run: |
          echo "TODO: vulnerability + license scan; upload to evidence/dependency-scans/"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate SBOM (placeholder)
        run: |
          echo "TODO: SPDX/CycloneDX SBOM; upload to evidence/sbom/"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret scan (placeholder)
        run: |
          echo "TODO: gitleaks/trufflehog over the diff"

  qemu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools gnu-efi
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build trusted-pba.efi (task installs the pinned TamaGo toolchain)
        run: task build
      - name: Build chainload test fixture (gnu-efi)
        run: task testapp
      - name: QEMU/OVMF chainload smoke test (assert markers)
        shell: bash
        env:
          TESTAPP: bin/testapp.efi
        run: |
          set -o pipefail
          python3 test/qemu/expect-serial.py bin/trusted-pba.efi | tee qemu-serial.log
      - name: QEMU/OVMF fail-closed test (no target staged → chainload must fail)
        shell: bash
        env:
          REQUIRE: 'TRUSTED-PBA: sed unlock not required by policy,TRUSTED-PBA: chainload failed'
          FORBID: 'TRUSTED-PBA: chainload returned,TEST-APP: ok,TRUSTED-PBA: sed unlock ok,TRUSTED-PBA: sed unlock failed'
        run: |
          set -o pipefail
          python3 test/qemu/expect-serial.py bin/trusted-pba.efi | tee -a qemu-serial.log
      - name: QEMU/OVMF Secure-Boot-required fail-closed test (require_secure_boot policy, SB off)
        shell: bash
        run: |
          set -o pipefail
          task sb-require-test | tee -a qemu-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu-serial.log

  real-image-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install a real Microsoft-signed shim (shim-signed)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shim-signed
      - name: Verify a genuine Microsoft-signed image (full accepts / windows-only rejects)
        run: |
          # First existing candidate in written preference order (ls would sort
          # alphabetically and drop that order, e.g. picking .signed over .latest).
          shim=""
          for c in /usr/lib/shim/shimx64.efi.signed.latest \
                   /usr/lib/shim/shimx64.efi.signed \
                   /usr/lib/shim/shim.efi.signed; do
            if [ -f "$c" ]; then shim="$c"; break; fi
          done
          if [ -z "$shim" ]; then echo "no signed shim found in /usr/lib/shim" >&2; exit 1; fi
          echo "using shim: $shim"
          TPBA_REAL_SHIM="$shim" go test ./internal/truststore/ -run TestRealMicrosoftSignedImage -v

  pba-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: PBA verify-then-load matrix (pba-accept signed / pba-reject unsigned fail-closed)
        run: task pba-matrix

  secureboot-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl/uuid
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl uuid-runtime python3-pip
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Secure Boot matrix (SB off / enforcing-signed / enforcing-unsigned-rejected)
        run: task sb-matrix

  # Phase 6 (#22, replaces the #9 placeholder): the MVP's primary virtual
  # integration test — MockOpalDxe (EDK2 Storage Security mock) + the
  # `-tags sedtest` PBA, full unlock→MBRDone→chainload matrix incl. fault
  # negatives and a Secure-Boot-enforcing run (test/qemu/mock-opal-matrix.sh).
  mock-opal-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl/uuid + EDK2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl uuid-runtime \
            python3-pip build-essential nasm acpica-tools uuid-dev
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Cache the pinned edk2 checkout + BaseTools + driver build intermediates.
      # The key covers the EDK2_TAG/EDK2_COMMIT pin (in build.sh) and the driver
      # sources, so a pin bump or source change rebuilds; restore-keys reuses the
      # expensive edk2 clone + BaseTools build either way (build.sh verifies the
      # cached checkout against the pinned commit before using it).
      - name: Cache pinned EDK2 tree (BaseTools + driver build)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpba-edk2
          key: tpba-edk2-${{ hashFiles('test/edk2-mock-opal/build.sh', 'test/edk2-mock-opal/MockOpalDxe.*', 'test/edk2-mock-opal/MockOpalPkg.*', 'test/edk2-mock-opal/Discovery0Locked.h') }}
          restore-keys: |
            tpba-edk2-
      - name: Mock-Opal integration matrix (build driver + sedtest PBA + fixture, run all scenarios)
        shell: bash
        run: |
          set -o pipefail
          task mock-opal-matrix | tee mock-opal-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-opal-serial-log
          path: mock-opal-serial.log
