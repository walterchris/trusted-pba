# Virtual CI — runs on every PR, no hardware (compliance baseline §18).
# NOTE: this is the SKELETON. Stages echo their intent and are replaced with real
# implementations by their tracked issues as the codebase lands. They are marked
# (placeholder) so a green run is not mistaken for real coverage.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: go test (placeholder — native Opal mock tests, #PHASE4)
        run: echo "TODO: go test ./... with coverage; upload to evidence/test-reports/"

