# Virtual CI — runs on every PR, no hardware (compliance baseline §18).
# NOTE: lint and qemu-smoke are real; the other jobs are SKELETON placeholders
# (clearly named) that their tracked issues (#9 + phase issues) replace with real
# implementations. They intentionally do nothing yet.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: policy parser fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./internal/policy

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: static analysis (placeholder)
        run: |
          echo "TODO: govulncheck + staticcheck/gosec; upload to evidence/sast-reports/"

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependency + license scan (placeholder)
        run: |
          echo "TODO: vulnerability + license scan; upload to evidence/dependency-scans/"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate SBOM (placeholder)
        run: |
          echo "TODO: SPDX/CycloneDX SBOM; upload to evidence/sbom/"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret scan (placeholder)
        run: |
          echo "TODO: gitleaks/trufflehog over the diff"

  qemu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools gnu-efi
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build trusted-pba.efi (task installs the pinned TamaGo toolchain)
        run: task build
      - name: Build chainload test fixture (gnu-efi)
        run: task testapp
      - name: QEMU/OVMF chainload smoke test (assert markers)
        shell: bash
        env:
          TESTAPP: bin/testapp.efi
        run: |
          set -o pipefail
          python3 test/qemu/expect-serial.py bin/trusted-pba.efi | tee qemu-serial.log
      - name: QEMU/OVMF fail-closed test (no target staged → chainload must fail)
        shell: bash
        env:
          REQUIRE: 'TRUSTED-PBA: chainload failed'
          FORBID: 'TRUSTED-PBA: chainload returned,TEST-APP: ok'
        run: |
          set -o pipefail
          python3 test/qemu/expect-serial.py bin/trusted-pba.efi | tee -a qemu-serial.log
      - name: QEMU/OVMF Secure-Boot-required fail-closed test (require_secure_boot policy, SB off)
        shell: bash
        run: |
          set -o pipefail
          task sb-require-test | tee -a qemu-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu-serial.log

  real-image-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install a real Microsoft-signed shim (shim-signed)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shim-signed
      - name: Verify a genuine Microsoft-signed image (full accepts / windows-only rejects)
        run: |
          shim=$(ls /usr/lib/shim/shimx64.efi.signed.latest \
                    /usr/lib/shim/shimx64.efi.signed \
                    /usr/lib/shim/shim.efi.signed 2>/dev/null | head -1)
          if [ -z "$shim" ]; then echo "no signed shim found in /usr/lib/shim" >&2; exit 1; fi
          echo "using shim: $shim"
          TPBA_REAL_SHIM="$shim" go test ./internal/truststore/ -run TestRealMicrosoftSignedImage -v

  pba-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: PBA verify-then-load matrix (pba-accept signed / pba-reject unsigned fail-closed)
        run: task pba-matrix

  secureboot-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl/uuid
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl uuid-runtime python3-pip
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Secure Boot matrix (SB off / enforcing-signed / enforcing-unsigned-rejected)
        run: task sb-matrix

  mock-opal-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mock Opal unlock + chainload (placeholder — #PHASE6)
        run: |
          echo "TODO: MockOpalDxe -> PBA unlock -> chainload test app; fail closed on Opal failure"
