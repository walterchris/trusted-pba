      - name: secret scan (placeholder)
        run: echo "TODO: gitleaks/trufflehog over the diff"

  qemu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build trusted-pba.efi (task installs the pinned TamaGo toolchain)
        run: task build
      - name: QEMU/OVMF smoke test (assert serial markers)
        shell: bash
        run: |
          set -o pipefail
          python3 test/qemu/expect-serial.py bin/trusted-pba.efi | tee qemu-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu-serial.log

