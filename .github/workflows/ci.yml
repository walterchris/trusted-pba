# Virtual CI — runs on every PR, no hardware (compliance baseline §18).
# All jobs are real: host analysis — lint (gofmt/vet/golangci incl.
# staticcheck+gosec), unit-test, fuzz-smoke, vuln-scan (govulncheck),
# license-check (go-licenses), sbom (cyclonedx-gomod), secret-scan (gitleaks),
# authenticode-realimage — plus the qemu-* boot matrices (QEMU/OVMF).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on a PR branch (a new push obsoletes the old run), but
# never cancel a push to main — those are the canonical post-merge runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: policy parser fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./internal/policy
      - name: opal response parser fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzResponseParse -fuzztime=30s ./internal/opal
      - name: imageverify PE/Authenticode parser fuzz (smoke)
        run: go test -run='^$' -fuzz=FuzzVerify -fuzztime=30s ./internal/imageverify

  # Reachable known-vulnerability analysis (SCA) over our code + deps: fails only
  # on vulnerabilities our code actually calls. Static analysis proper (staticcheck
  # + gosec) runs in the `lint` job via golangci-lint.
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Dependency LICENSE compliance (not vulnerabilities — those are in vuln-scan):
  # checks dependency licenses against go-licenses' forbidden set. First-party
  # packages are ignored (no repo LICENSE yet — tracked in #27).
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go-licenses check (dependencies)
        run: |
          go install github.com/google/go-licenses@v1.6.0
          "$(go env GOPATH)/bin/go-licenses" check ./... --ignore github.com/walterchris/trusted-pba

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: generate CycloneDX SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json -output sbom.cdx.json
      - name: upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # gitleaks in git mode scans tracked content + history (respects .gitignore, so
  # the build-output bin/ is excluded). Pinned binary + checksum (no third-party
  # action in the trust path).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary, checksum-verified)
        run: |
          set -euo pipefail
          ver=8.21.2
          sha=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact

  qemu-chainload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools gnu-efi
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Cache the pinned TamaGo toolchain (task build/setup installs it under
      # ~/.tamago when absent; `task toolchain`'s status check then skips the
      # download). Keyed on Taskfile.yml, which carries the version + checksum.
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      - name: Build trusted-pba.efi (task installs the pinned TamaGo toolchain)
        run: task build
      - name: Build chainload test fixture (gnu-efi)
        run: task testapp
      - name: QEMU/OVMF chainload smoke test (assert markers)
        shell: bash
        env:
          TESTAPP: bin/testapp.efi
        run: |
          set -o pipefail
          python3 test/qemu/expect-serial.py bin/trusted-pba.efi | tee qemu-serial.log
      - name: QEMU/OVMF fail-closed test (no target staged → chainload must fail)
        shell: bash
        # Markers live in the Taskfile `run-negative` target — single-sourced so a
        # rename can't desync CI from `task check` (audit F-S18).
        run: |
          set -o pipefail
          task run-negative | tee -a qemu-serial.log
      - name: QEMU/OVMF Secure-Boot-required fail-closed test (require_secure_boot policy, SB off)
        shell: bash
        run: |
          set -o pipefail
          task sb-require-test | tee -a qemu-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu-serial.log

  authenticode-realimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install a real Microsoft-signed shim (shim-signed)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shim-signed
      - name: Verify a genuine Microsoft-signed image (full accepts / windows-only rejects)
        run: |
          # First existing candidate in written preference order (ls would sort
          # alphabetically and drop that order, e.g. picking .signed over .latest).
          shim=""
          for c in /usr/lib/shim/shimx64.efi.signed.latest \
                   /usr/lib/shim/shimx64.efi.signed \
                   /usr/lib/shim/shim.efi.signed; do
            if [ -f "$c" ]; then shim="$c"; break; fi
          done
          if [ -z "$shim" ]; then echo "no signed shim found in /usr/lib/shim" >&2; exit 1; fi
          echo "using shim: $shim"
          TPBA_REAL_SHIM="$shim" go test ./internal/truststore/ -run TestRealMicrosoftSignedImage -v

  qemu-pba-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Cache the pinned TamaGo toolchain (task build/setup installs it under
      # ~/.tamago when absent; `task toolchain`'s status check then skips the
      # download). Keyed on Taskfile.yml, which carries the version + checksum.
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      - name: PBA verify-then-load matrix (pba-accept signed / pba-reject unsigned fail-closed)
        run: task pba-matrix

  qemu-secureboot-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Host Go: the matrix computes the PBA's Authenticode hash for the dbx-by-hash
      # scenario (E) via test/qemu/authenticode-hash (go run, reusing go-uefi).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl/uuid
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl uuid-runtime python3-pip
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Cache the pinned TamaGo toolchain (task build/setup installs it under
      # ~/.tamago when absent; `task toolchain`'s status check then skips the
      # download). Keyed on Taskfile.yml, which carries the version + checksum.
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      - name: Secure Boot matrix (SB off / enforcing-signed / enforcing-unsigned / dbx-hash-revoked)
        run: task sb-matrix

  # Phase 6 (#22, replaces the #9 placeholder): the MVP's primary virtual
  # integration test — MockOpalDxe (EDK2 Storage Security mock) + the
  # `-tags sedtest` PBA, full unlock→MBRDone→chainload matrix incl. fault
  # negatives and a Secure-Boot-enforcing run (test/qemu/mock-opal-matrix.sh).
  qemu-opal-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl/uuid + EDK2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl uuid-runtime \
            python3-pip build-essential nasm acpica-tools uuid-dev
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Cache the pinned TamaGo toolchain (task build/setup installs it under
      # ~/.tamago when absent; `task toolchain`'s status check then skips the
      # download). Keyed on Taskfile.yml, which carries the version + checksum.
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      # Cache the pinned edk2 checkout + BaseTools + driver build intermediates.
      # The key covers the EDK2_TAG/EDK2_COMMIT pin (in build.sh) and the driver
      # sources, so a pin bump or source change rebuilds; restore-keys reuses the
      # expensive edk2 clone + BaseTools build either way (build.sh verifies the
      # cached checkout against the pinned commit before using it).
      - name: Cache pinned EDK2 tree (BaseTools + driver build)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpba-edk2
          key: tpba-edk2-${{ hashFiles('test/edk2-mock-opal/build.sh', 'test/edk2-mock-opal/MockOpalDxe.*', 'test/edk2-mock-opal/MockOpalPkg.*', 'test/edk2-mock-opal/Discovery0Locked.h') }}
          restore-keys: |
            tpba-edk2-
      - name: Mock-Opal integration matrix (build driver + sedtest PBA + fixture, run all scenarios)
        shell: bash
        run: |
          set -o pipefail
          task mock-opal-matrix | tee mock-opal-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-opal-serial-log
          path: mock-opal-serial.log

  # NVMe-passthru Opal matrix (#110): the sedutil-pbkdf2-over-NVMe unlock —
  # MockOpalDxe's EFI_NVM_EXPRESS_PASS_THRU surface (Identify salt + Security
  # Send/Receive session) + the `-tags sednvmetest,hwdebug` PBA. POS proves the
  # #112 auto path end-to-end (advance 500000→75000); NEGs prove try-limit stop
  # on lockout and hard fail with zero pass-thru handles.
  qemu-nvme-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, openssl/uuid + EDK2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi openssl uuid-runtime \
            python3-pip build-essential nasm acpica-tools uuid-dev
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      # Same key strategy as qemu-opal-matrix: covers the EDK2 pin and driver
      # sources; restore-keys reuses the expensive edk2 clone + BaseTools build.
      - name: Cache pinned EDK2 tree (BaseTools + driver build)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpba-edk2
          key: tpba-edk2-${{ hashFiles('test/edk2-mock-opal/build.sh', 'test/edk2-mock-opal/MockOpalDxe.*', 'test/edk2-mock-opal/MockOpalPkg.*', 'test/edk2-mock-opal/Discovery0Locked.h') }}
          restore-keys: |
            tpba-edk2-
      - name: NVMe-passthru Opal matrix (build driver + sednvmetest PBA + fixture, run all scenarios)
        shell: bash
        run: |
          set -o pipefail
          task nvme-opal-matrix | tee nvme-opal-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvme-opal-serial-log
          path: nvme-opal-serial.log

  # Linux-boot matrix: the PBA boots a REAL Linux kernel (the runner's own,
  # packed as a UKI with a one-binary Go initramfs) to userspace after the
  # mock-SED unlock — POS, NEG (auth-fail -> the OS never boots), and POS under
  # enforcing Secure Boot with a db-signed UKI (test/qemu/linux-boot-matrix.sh).
  qemu-linux-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, sbsigntool, ukify + EDK2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools sbsigntool openssl uuid-runtime cpio \
            systemd-ukify systemd-boot-efi \
            python3-pip build-essential nasm acpica-tools uuid-dev
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Stage the runner kernel for the UKI (readable copy)
        run: |
          sudo install -m 0644 "/boot/vmlinuz-$(uname -r)" /tmp/tpba-vmlinuz
          echo "TPBA_LINUX_KERNEL=/tmp/tpba-vmlinuz" >> "$GITHUB_ENV"
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      # Same key strategy as qemu-opal-matrix: covers the EDK2 pin and driver
      # sources; restore-keys reuses the expensive edk2 clone + BaseTools build.
      - name: Cache pinned EDK2 tree (BaseTools + driver build)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpba-edk2
          key: tpba-edk2-${{ hashFiles('test/edk2-mock-opal/build.sh', 'test/edk2-mock-opal/MockOpalDxe.*', 'test/edk2-mock-opal/MockOpalPkg.*', 'test/edk2-mock-opal/Discovery0Locked.h') }}
          restore-keys: |
            tpba-edk2-
      - name: Linux-boot matrix (build driver + sedtest PBA + UKI, run all scenarios)
        shell: bash
        run: |
          set -o pipefail
          task linux-boot-matrix | tee linux-boot-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-boot-serial-log
          path: linux-boot-serial.log

  # pba-override trust broker (ADR-0012/0013, -tags trustbroker). Guards the merged
  # Secure Boot override: CONTROL (firmware rejects the out-of-db, PBA-verified
  # fixture), POS (override arms for exactly that buffer -> boots), TAMPER (unsigned
  # -> verify fails closed, never armed), SB-OFF (refuses to arm when SB not
  # enforcing). Our-keys-only OVMF, throwaway test keys (never committed).
  qemu-override-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, sbsigntool, openssl/uuid
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi sbsigntool openssl uuid-runtime python3-pip
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      - name: pba-override trust-broker matrix (CONTROL / POS / TAMPER / SB-OFF)
        shell: bash
        run: |
          set -o pipefail
          task override-matrix | tee override-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: override-serial-log
          path: override-serial.log

  # Console credential-source matrix (ADR-0011 A2, #99): automated QMP send-key
  # injection drives the interactive passphrase prompt headlessly.
  #   POS: "correct horse" → MOCKOPAL auth ok + sed unlock ok + TEST-APP: ok
  #   NEG: "wrong pass"    → sed unlock failed; no boot (fail-closed proof)
  # Key injection uses QMP send-key (PS/2 qcode events → OVMF ConIn), not serial
  # stdin (which OVMF's TerminalDxe mangles under -display none).
  qemu-console-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, openssl/uuid + EDK2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi openssl uuid-runtime \
            python3-pip build-essential nasm acpica-tools uuid-dev
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Cache the pinned TamaGo toolchain (task build/setup installs it under
      # ~/.tamago when absent; `task toolchain`'s status check then skips the
      # download). Keyed on Taskfile.yml, which carries the version + checksum.
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      # Cache the pinned edk2 checkout + BaseTools + driver build intermediates.
      # Same key strategy as qemu-opal-matrix: covers the EDK2 pin and
      # driver sources so a bump or source change triggers a rebuild.
      - name: Cache pinned EDK2 tree (BaseTools + driver build)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpba-edk2
          key: tpba-edk2-${{ hashFiles('test/edk2-mock-opal/build.sh', 'test/edk2-mock-opal/MockOpalDxe.*', 'test/edk2-mock-opal/MockOpalPkg.*', 'test/edk2-mock-opal/Discovery0Locked.h') }}
          restore-keys: |
            tpba-edk2-
      - name: Console credential-source matrix (POS correct-pass / NEG wrong-pass)
        shell: bash
        run: |
          set -o pipefail
          task console-matrix | tee console-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-serial-log
          path: console-serial.log

  # Keyfile credential-source matrix (ADR-0011 A3, #100): stage a key on the ESP
  # and boot the keyfiletest PBA + MockOpalDxe headlessly.
  #   POS: correct key ("correct horse") → MOCKOPAL auth ok + sed unlock ok + TEST-APP: ok
  #   NEG: wrong key                      → sed unlock failed; no boot (fail-closed proof)
  # No key injection needed (the key is a file, not a prompt), so this uses the
  # expect-serial.py driver like the mock-opal matrix.
  qemu-keyfile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools, gnu-efi, openssl/uuid + EDK2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gnu-efi openssl uuid-runtime \
            python3-pip build-essential nasm acpica-tools uuid-dev
      - name: Install virt-firmware (virt-fw-vars)
        run: pip install --user --break-system-packages 'virt-firmware==26.5.4'
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache pinned TamaGo toolchain
        uses: actions/cache@v4
        with:
          path: ~/.tamago
          key: tamago-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}
      - name: Cache pinned EDK2 tree (BaseTools + driver build)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tpba-edk2
          key: tpba-edk2-${{ hashFiles('test/edk2-mock-opal/build.sh', 'test/edk2-mock-opal/MockOpalDxe.*', 'test/edk2-mock-opal/MockOpalPkg.*', 'test/edk2-mock-opal/Discovery0Locked.h') }}
          restore-keys: |
            tpba-edk2-
      - name: Keyfile credential-source matrix (POS correct-key / NEG wrong-key)
        shell: bash
        run: |
          set -o pipefail
          task keyfile-matrix | tee keyfile-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyfile-serial-log
          path: keyfile-serial.log
