  qemu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools
      - name: Install TamaGo toolchain (go1.26.4)
        run: |
          curl -fsSL -o /tmp/tamago.tgz https://github.com/usbarmory/tamago-go/releases/download/go1.26.4/tamago-go1.26.4.linux-amd64.tar.gz
          sudo tar -xzf /tmp/tamago.tgz -C /
          /usr/local/tamago-go/bin/go version
      - name: Build trusted-pba.efi
        run: make build
        env:
          TAMAGO: /usr/local/tamago-go/bin/go
      - name: QEMU/OVMF smoke test (assert serial markers)
        run: python3 test/qemu/expect-serial.py bin/trusted-pba.efi | tee qemu-serial.log
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu-serial.log

