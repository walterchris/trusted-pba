# Taskfile (demo:) — human-facing, watchable showcases of the full boot flow.
#
# Included by the root Taskfile as the `demo:` namespace. Unlike the test: matrices
# (headless, assertion-driven, CI-safe), these are meant to be run interactively in
# a terminal / graphical QEMU window to demonstrate a real unlock-and-chainload.
#
# The `build:` namespace is re-included (internal) so demos can build the PBA and
# fixtures without re-appearing in `task --list`.
version: '3'

includes:
  build:
    taskfile: ./Taskfile.build.yml
    internal: true

vars:
  APP: trusted-pba
  BIN: bin

tasks:
  linux:
    desc: 'Watchable full-flow demo — PBA → mock Opal SED unlock → the PBA validates + chainloads a signed Alpine UKI → REAL Alpine boots to login. Flags: SECUREBOOT=1 (default) firmware SB enforcing with db=key-A-only + pba-override trust broker for the key-B UKI; SECUREBOOT=0 plain (no SB); INTERACTIVE=1 type the passphrase yourself (else auto-typed); SERIAL=1 headless. Downloads Alpine on first run (cached). Needs qemu, OVMF, mtools, parted, xorriso, ukify+stub, sbsign, openssl, virt-firmware, EDK2 build deps.'
    vars:
      SB: '{{.SECUREBOOT | default "1"}}'
      OUT: '{{.APP}}-{{if eq .SB "0"}}demolinuxplain{{else}}demolinuxsb{{end}}'
      TAGS: '{{if eq .SB "0"}}demolinuxplain,pbatest{{else}}demolinuxsb,pbatest,trustbroker{{end}}'
    cmds:
      - task: build:mock-opal
      - test/qemu/demo-secureboot-setup.sh
      - task: build:_efi
        vars: { OUT: '{{.OUT}}', EXTRA_TAGS: ',{{.TAGS}}' }
      - SECUREBOOT={{.SB}} INTERACTIVE={{.INTERACTIVE | default "0"}} SERIAL={{.SERIAL | default ""}} test/qemu/demo-linux.sh {{.BIN}}/{{.OUT}}.efi

  secureboot:
    desc: 'Watchable Secure Boot + trust-broker demo — OVMF with SB ENFORCING and our keys enrolled: firmware validates the signed PBA (hop 1) → the PBA trust-brokers the OS (`pba` validation of the Alpine UKI signed by a second key we added to the broker, hop 2) → firmware re-validates on load (hop 3) → real Alpine boots. Downloads Alpine on first run (cached). SERIAL=1 for headless. Needs qemu, OVMF, mtools, parted, xorriso, ukify+stub, sbsign, openssl, virt-firmware.'
    cmds:
      - test/qemu/demo-secureboot-setup.sh
      - task: build:_efi
        vars: { OUT: '{{.APP}}-demosb', EXTRA_TAGS: ",pbatest,demosb" }
      - test/qemu/demo-secureboot.sh {{.BIN}}/{{.APP}}-demosb.efi

  windows:
    desc: 'Watchable Secure Boot → Windows demo. DEFAULT (Key-A-only override, ADR-0014): db = OUR KEY A ONLY, firmware validates the PBA, the PBA trust-brokers Windows Boot Manager against its own Microsoft CAs and admits it via the shim-style Security2 override → real Windows. Self-contained WinPE/Setup path (+ a mock Opal SED unlock); WIN_OSDISK=<disk> boots a FULL installed Windows through the override on AHCI to the logon screen. BITLOCKER=1 WIN_OSDISK=<disk> (firmware-db model, ADR-0013): db = key A + Microsoft CAs, firmware validates bootmgfw → normal PCR 7 → boot a BitLocker-encrypted Windows that TPM-AUTO-UNLOCKS through the PBA (SETUP=1 to (re)enable BitLocker first, one-time ~10 min; cached after). The override CANNOT do BitLocker (PCR-7 OS-loader authority is non-reproducible → recovery). Flags: INTERACTIVE=1 (WinPE SED passphrase); SCREENSHOT=<png>; WIN_ISO=<path>. Needs qemu, OVMF (incl. a 4M TPM build for BITLOCKER), mtools, ntfsprogs, parted, xorriso, sbsign, openssl, virt-firmware, swtpm, EDK2 build deps.'
    vars:
      OSD: '{{.WIN_OSDISK}}'
      BL: '{{.BITLOCKER}}'
      OUT: '{{.APP}}-{{if eq .BL "1"}}demowinbl{{else if .OSD}}demowinnosed{{else}}demowin{{end}}'
      TAGS: '{{if eq .BL "1"}}demowinbl{{else if .OSD}}demowinnosed,trustbroker{{else}}demowin,trustbroker{{end}}'
    cmds:
      - task: build:mock-opal
      - task: build:_efi
        vars: { OUT: '{{.OUT}}', EXTRA_TAGS: ',{{.TAGS}}' }
      - |
        {{if eq .BL "1"}}
        SETUP={{.SETUP | default ""}} WIN_OSDISK='{{.OSD}}' SCREENSHOT={{.SCREENSHOT | default ""}} SERIAL={{.SERIAL | default ""}} test/qemu/demo-windows-bitlocker.sh {{.BIN}}/{{.OUT}}.efi
        {{else}}
        WIN_OSDISK='{{.OSD}}' INTERACTIVE={{.INTERACTIVE | default "0"}} SERIAL={{.SERIAL | default ""}} SCREENSHOT={{.SCREENSHOT | default ""}} test/qemu/demo-windows.sh {{.BIN}}/{{.OUT}}.efi
        {{end}}

  # sed — MANUAL/interactive: exercise the console credential source (ADR-0011 A2) in
  # QEMU with the MockOpalDxe SED; you type the SED passphrase at the prompt ("correct
  # horse" unlocks). Superseded by `demo:linux INTERACTIVE=1`; kept as the minimal
  # credential-only harness. Run in a terminal, not CI.
  sed:
    cmds:
      - task: build:mock-opal
      - task: build:testapp
      - task: build:_efi
        vars: { OUT: '{{.APP}}-consoletest', EXTRA_TAGS: ",consoletest" }
      - test/qemu/console-manual.sh {{.BIN}}/{{.APP}}-consoletest.efi {{.BIN}}/testapp.efi
