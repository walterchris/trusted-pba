# Taskfile for Trusted PBA — the single entry point for setup/build/run/test.
# Install go-task: https://taskfile.dev/installation/   Then: `task setup && task run`.
#
# This root file holds the everyday verbs (setup, build, run, test, lint, check).
# The rest is split into namespaces so `task --list` stays legible:
#
#   build:*   toolchain + artifact/fixture builds   (Taskfile.build.yml)
#   test:*    QEMU/OVMF integration matrices + negatives + release gate (Taskfile.test.yml)
#   demo:*    watchable, interactive full-boot-flow showcases (Taskfile.demo.yml)
#
# There is no Makefile. The QEMU launch + serial assertion live in
# test/qemu/{run-qemu.sh,expect-serial.py}, which `run` invokes.
version: '3'

includes:
  build: ./Taskfile.build.yml
  test: ./Taskfile.test.yml
  demo: ./Taskfile.demo.yml

vars:
  # Mirror of build:'s output location + app name so the root smoke/check tasks can
  # name the built artifact (go-task vars are file-scoped; source of truth is
  # Taskfile.build.yml). Effectively constant.
  APP: trusted-pba
  BIN: bin

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  setup:
    desc: 'One-time setup: install the TamaGo toolchain (if missing) and resolve deps'
    cmds:
      - task: build:toolchain
      - task: build:deps

  build:
    desc: Build bin/trusted-pba.efi
    cmds:
      - task: build:efi

  run:
    desc: Build PBA + test fixture and boot in QEMU/OVMF (asserts chainload markers)
    aliases: [qemu]
    cmds:
      - task: build:efi
      - task: build:testapp
      - TESTAPP={{.BIN}}/testapp.efi python3 test/qemu/expect-serial.py {{.BIN}}/{{.APP}}.efi

  test:
    desc: Run host Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet on host packages
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go sources (gofmt -w)
    cmds:
      - gofmt -l -w .

  lint:
    desc: gofmt check + go vet + golangci-lint (installs golangci-lint if missing)
    vars:
      GCL:
        sh: echo "$(go env GOPATH)/bin/golangci-lint"
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - go vet ./...
      - |
        if [ ! -x "{{.GCL}}" ]; then
          echo "installing golangci-lint v2.12.2…"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        fi
        "{{.GCL}}" run ./...

  check:
    desc: 'Local CI: lint + host tests + chainload smoke (happy + fail-closed) + Secure Boot matrix'
    cmds:
      - task: lint
      - task: test
      - task: run
      - task: test:negative
      - task: test:sb-require
      - task: test:pba
      - task: test:sb

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN}}
