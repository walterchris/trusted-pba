# Taskfile for Trusted PBA — the single entry point for setup/build/run/test.
# Install go-task: https://taskfile.dev/installation/   Then: `task setup && task run`.
#
# This root file holds the everyday verbs (setup, build, run, test, lint, check).
# The rest is split into namespaces so `task --list` stays legible:
#
#   build:*   toolchain + artifact/fixture builds   (Taskfile.build.yml)
#   test:*    QEMU/OVMF integration matrices + negatives + release gate (Taskfile.test.yml)
#   demo:*    watchable, interactive full-boot-flow showcases (Taskfile.demo.yml)
#
# There is no Makefile. The QEMU launch + serial assertion live in
# test/qemu/{run-qemu.sh,expect-serial.py}, which `run` invokes.
version: '3'

includes:
  build: ./Taskfile.build.yml
  test: ./Taskfile.test.yml
  demo: ./Taskfile.demo.yml

vars:
  # Mirror of build:'s output location + app name so the root smoke/check tasks can
  # name the built artifact (go-task vars are file-scoped; source of truth is
  # Taskfile.build.yml). Effectively constant.
  APP: trusted-pba
  BIN: bin

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  setup:
    desc: 'One-time setup: install the TamaGo toolchain (if missing) and resolve deps'
    cmds:
      - task: build:toolchain
      - task: build:deps

  build:
    desc: Build bin/trusted-pba.efi
    cmds:
      - task: build:efi

  # run (alias: qemu) — build PBA + fixture and boot in QEMU/OVMF, asserting the
  # chainload markers. A building block of `check`/`ci`; not an everyday verb.
  run:
    aliases: [qemu]
    cmds:
      - task: build:efi
      - task: build:testapp
      - TESTAPP={{.BIN}}/testapp.efi python3 test/qemu/expect-serial.py {{.BIN}}/{{.APP}}.efi

  # test — host Go tests. Run via `check`/`ci`.
  test:
    cmds:
      - go test ./...

  # vet — go vet on host packages. Run via `lint` → `check`/`ci`.
  vet:
    cmds:
      - go vet ./...

  # fmt — format Go sources in place (gofmt -w). Excludes .demo-cache/ (vendored
  # EDK2/OVMF checkouts whose upstream Go files we neither own nor format); the go
  # tool already skips dot-dirs for vet/build, but gofmt's raw filesystem walk does not.
  fmt:
    cmds:
      - find . -path ./.demo-cache -prune -o -name '*.go' -print0 | xargs -0r gofmt -l -w

  # lint — gofmt check + go vet + golangci-lint (installs golangci-lint if missing).
  lint:
    vars:
      GCL:
        sh: echo "$(go env GOPATH)/bin/golangci-lint"
    cmds:
      - |
        files=$(find . -path ./.demo-cache -prune -o -name '*.go' -print0 | xargs -0r gofmt -l)
        if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - go vet ./...
      - |
        if [ ! -x "{{.GCL}}" ]; then
          echo "installing golangci-lint v2.12.2…"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        fi
        "{{.GCL}}" run ./...

  check:
    desc: 'Fast local gate: lint + host tests + chainload smoke (happy + fail-closed) + Secure Boot matrix. The everyday pre-push check.'
    cmds:
      - task: lint
      - task: test
      - task: run
      - task: test:negative
      - task: test:sb-require
      - task: test:pba
      - task: test:sb

  ci:
    desc: 'Full local CI mirror: everything in `check`, plus every heavier QEMU/OVMF matrix (opal-mock, opal-nvme, console, keyfile, linux, override) and the PCR-divergence proof (override-pcr). Needs EDK2 build deps, swtpm, sbsign, virt-firmware.'
    cmds:
      - task: check
      - task: test:opal-mock
      - task: test:opal-nvme
      - task: test:console
      - task: test:keyfile
      - task: test:linux
      - task: test:override
      - task: test:override-pcr

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN}}
