# Taskfile for Trusted PBA — the single entry point for setup/build/run/test.
# Install go-task: https://taskfile.dev/installation/   Then: `task setup && task run`.
#
# This file owns the build (there is no Makefile). The QEMU launch + serial
# assertion live in test/qemu/{run-qemu.sh,expect-serial.py}, which `task run`
# invokes.
#
# TamaGo resolves from $TAMAGO (an existing toolchain) if set, else a managed
# install under $TAMAGO_ROOT (default ~/.tamago/<version>); `task setup`/`build`
# installs it automatically when missing.
version: '3'

env:
  # Exported for any go subprocess that consults it.
  TAMAGO: '{{.TAMAGO_BIN}}'

vars:
  # --- toolchain ---
  TAMAGO_VERSION: go1.26.4
  # SHA-256 of tamago-{{.TAMAGO_VERSION}}.linux-amd64.tar.gz, verified on download
  # (supply-chain hygiene, baseline §14/§19; #27). Recompute when bumping the pin.
  TAMAGO_SHA256: 829a4ea1eaf72a2e7bf57f06feca82fb97b8f67d8ad8e6d870c27fcc5e720a43
  TAMAGO_ROOT:
    sh: echo "${TAMAGO_ROOT:-$HOME/.tamago/{{.TAMAGO_VERSION}}}"
  TAMAGO_BIN:
    sh: echo "${TAMAGO:-{{.TAMAGO_ROOT}}/bin/go}"
  # --- dependency pins (bump deliberately; supply-chain hygiene, baseline §14) ---
  GOBOOT_VERSION: v1.6.2
  TAMAGO_LIB_VERSION: v1.26.4
  # --- build ---
  APP: trusted-pba
  BIN: bin
  IMAGE_BASE: '10000000'            # PE image base 0x10000000
  TEXT_START: '268500992'           # 0x10010000 = IMAGE_BASE + 0x10000
  BUILD_TAGS: linkcpuinit,linkramsize,linkramstart,linkprintk
  GOENV: GOOS=tamago GOOSPKG=github.com/usbarmory/tamago GOARCH=amd64
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  setup:
    desc: 'One-time setup: install the TamaGo toolchain (if missing) and resolve deps'
    cmds:
      - task: toolchain
      - task: deps

  toolchain:
    desc: Install the pinned TamaGo toolchain (go1.26.4, linux/amd64) under $TAMAGO_ROOT (~/.tamago by default)
    status:
      - test -x "{{.TAMAGO_BIN}}"
    cmds:
      - mkdir -p "{{.TAMAGO_ROOT}}"
      # Release tag is `tamago-go1.26.4` (upstream renamed from the old `go1.26.4`
      # scheme ~2026-06); the asset keeps the `tamago-` prefix too. Both the tag
      # path and the asset name therefore use `tamago-{{.TAMAGO_VERSION}}`.
      - curl -fsSL -o /tmp/tamago-{{.TAMAGO_VERSION}}.tar.gz https://github.com/usbarmory/tamago-go/releases/download/tamago-{{.TAMAGO_VERSION}}/tamago-{{.TAMAGO_VERSION}}.linux-amd64.tar.gz
      # Verify the pinned checksum before trusting the toolchain (it is part of the
      # build TCB). Fails closed on a tampered/changed/corrupt artifact.
      - echo "{{.TAMAGO_SHA256}}  /tmp/tamago-{{.TAMAGO_VERSION}}.tar.gz" | sha256sum -c -
      # Tarball uses absolute paths (usr/local/tamago-go/...); strip them so the
      # toolchain lands directly under TAMAGO_ROOT (TAMAGO_ROOT/bin/go).
      - tar -xzf /tmp/tamago-{{.TAMAGO_VERSION}}.tar.gz -C "{{.TAMAGO_ROOT}}" --strip-components=3
      - '"{{.TAMAGO_BIN}}" version'

  deps:
    desc: Resolve and pin Go module dependencies (go-boot, tamago)
    deps: [toolchain]
    cmds:
      - '{{.GOENV}} "{{.TAMAGO_BIN}}" get github.com/usbarmory/go-boot@{{.GOBOOT_VERSION}} github.com/usbarmory/tamago@{{.TAMAGO_LIB_VERSION}}'
      - '{{.GOENV}} "{{.TAMAGO_BIN}}" mod tidy'

  # _efi builds cmd/pba into a PE/EFI app. OUT = output basename in bin/;
  # EXTRA_TAGS = extra build tags appended after BUILD_TAGS (e.g. ",policytest").
  # objcopy wraps ELF->efi-app, then the PE COFF Characteristics at offset 150 are
  # patched to 0x0226 (go-boot convention); qemu-smoke guards a non-bootable result.
  _efi:
    internal: true
    deps: [toolchain]
    cmds:
      - mkdir -p {{.BIN}}
      - >-
        {{.GOENV}} "{{.TAMAGO_BIN}}" build -tags {{.BUILD_TAGS}}{{.EXTRA_TAGS}} -trimpath
        -ldflags "-s -w -E cpuinit -T {{.TEXT_START}} -R 0x1000 -X 'main.Version={{.VERSION}}'"
        -o {{.BIN}}/{{.OUT}} ./cmd/pba
      - >-
        objcopy --strip-debug --output-target efi-app-x86_64 --subsystem=efi-app
        --image-base 0x{{.IMAGE_BASE}} --stack=0x10000
        {{.BIN}}/{{.OUT}} {{.BIN}}/{{.OUT}}.efi
      - printf '\x26\x02' | dd of={{.BIN}}/{{.OUT}}.efi bs=1 seek=150 count=2 conv=notrunc,fsync status=none
      - echo "built {{.BIN}}/{{.OUT}}.efi (version {{.VERSION}})"

  build:
    desc: Build bin/trusted-pba.efi
    cmds:
      - task: _efi
        vars: { OUT: '{{.APP}}', EXTRA_TAGS: "" }

  testapp:
    desc: Build the gnu-efi chainload test fixture (bin/testapp.efi)
    vars:
      # gnu-efi link inputs / headers; override via $EFILIB / $EFIINC if a distro
      # places them elsewhere than the Fedora/Ubuntu default of /usr/lib + /usr/include/efi.
      EFILIB:
        sh: echo "${EFILIB:-/usr/lib}"
      EFIINC:
        sh: echo "${EFIINC:-/usr/include/efi}"
      CFLAGS: -I{{.EFIINC}} -I{{.EFIINC}}/x86_64 -fpic -ffreestanding -fno-stack-protector -fno-strict-aliasing -fshort-wchar -mno-red-zone -Wall
    cmds:
      - mkdir -p {{.BIN}}
      - gcc {{.CFLAGS}} -c test/fixtures/testapp/testapp.c -o {{.BIN}}/testapp.o
      - >-
        ld {{.BIN}}/testapp.o {{.EFILIB}}/crt0-efi-x86_64.o -nostdlib -znocombreloc
        -T {{.EFILIB}}/elf_x86_64_efi.lds -shared -Bsymbolic -L{{.EFILIB}} -lgnuefi -lefi
        -o {{.BIN}}/testapp.so
      # Full canonical gnu-efi section list — the relocation sections (.rel*/.rela*)
      # are required or the loaded image's pointers are not fixed up (garbage output).
      - >-
        objcopy -j .text -j .sdata -j .data -j .dynamic -j .dynsym
        -j '.rel.*' -j '.rela.*' -j .rel -j .rela -j .reloc
        --target efi-app-x86_64 {{.BIN}}/testapp.so {{.BIN}}/testapp.efi
      - echo "built {{.BIN}}/testapp.efi"

  run:
    desc: Build PBA + test fixture and boot in QEMU/OVMF (asserts chainload markers)
    aliases: [qemu]
    cmds:
      - task: build
      - task: testapp
      - TESTAPP={{.BIN}}/testapp.efi python3 test/qemu/expect-serial.py {{.BIN}}/{{.APP}}.efi

  run-negative:
    desc: Boot the PBA with NO chainload target staged; assert it fails closed (no success)
    cmds:
      - task: build
      - >-
        REQUIRE='TRUSTED-PBA: sed unlock not required by policy,TRUSTED-PBA: chainload failed'
        FORBID='TRUSTED-PBA: chainload returned,TEST-APP: ok,TRUSTED-PBA: sed unlock ok,TRUSTED-PBA: sed unlock failed'
        python3 test/qemu/expect-serial.py {{.BIN}}/{{.APP}}.efi

  sb-matrix:
    desc: Secure Boot matrix — SB off / enforcing-signed / enforcing-unsigned-rejected / dbx-hash-revoked (needs virt-firmware, sbsign, openssl, host go)
    cmds:
      - task: build
      - task: testapp
      - test/qemu/secureboot-matrix.sh {{.BIN}}/{{.APP}}.efi {{.BIN}}/testapp.efi

  sb-require-test:
    desc: Build a require_secure_boot policy variant and assert it fails closed when Secure Boot is off
    cmds:
      - task: _efi
        vars: { OUT: '{{.APP}}-policytest', EXTRA_TAGS: ",policytest" }
      - >-
        REQUIRE='policy requires Secure Boot enforcing'
        FORBID='TEST-APP: ok,TRUSTED-PBA: chainload returned,TRUSTED-PBA: sed unlock ok,TRUSTED-PBA: sed unlock failed'
        python3 test/qemu/expect-serial.py {{.BIN}}/{{.APP}}-policytest.efi

  pba-matrix:
    desc: PBA verify-then-load matrix — embed a test CA, sign the fixture, assert accept + fail-closed reject (needs sbsign, openssl)
    cmds:
      - task: testapp
      - test/qemu/pba-setup.sh {{.BIN}}/testapp.efi
      - task: _efi
        vars: { OUT: '{{.APP}}-pbatest', EXTRA_TAGS: ",pbatest" }
      - test/qemu/pba-run.sh {{.BIN}}/{{.APP}}-pbatest.efi {{.BIN}}/testapp.efi

  override-matrix:
    desc: 'pba-override trust-broker matrix — CONTROL (firmware rejects out-of-db) / POS (override boots) / TAMPER (unsigned fails closed) / SB-OFF (refuses when not enforcing). Gated behind -tags trustbroker (needs sbsign, virt-firmware, openssl).'
    cmds:
      - task: testapp
      - test/qemu/pba-setup.sh {{.BIN}}/testapp.efi
      - task: _efi
        vars: { OUT: '{{.APP}}-pbatest', EXTRA_TAGS: ",pbatest" }
      - task: _efi
        vars: { OUT: '{{.APP}}-overridetest', EXTRA_TAGS: ",overridetest,pbatest,trustbroker" }
      - test/qemu/override-trustbroker.sh {{.BIN}}/{{.APP}}-pbatest.efi {{.BIN}}/{{.APP}}-overridetest.efi {{.BIN}}/pbatest/testapp-signed.efi {{.BIN}}/testapp.efi

  mock-opal-matrix:
    desc: Mock-Opal integration matrix — unlock→MBRDone→chainload + fault negatives against MockOpalDxe in QEMU/OVMF (needs EDK2 build deps, sbsign, virt-firmware)
    cmds:
      - test/edk2-mock-opal/build.sh
      - task: testapp
      - task: _efi
        vars: { OUT: '{{.APP}}-sedtest', EXTRA_TAGS: ",sedtest" }
      - test/qemu/mock-opal-matrix.sh {{.BIN}}/{{.APP}}-sedtest.efi {{.BIN}}/testapp.efi

  win-handoff:
    desc: Windows-handoff (A') — real Microsoft-signed loader verified by the PBA and loaded via firmware db under Secure Boot (needs sbsign, virt-firmware; set TPBA_REAL_WINLOADER/TPBA_REAL_SHIM or it skips). See ADR-0011.
    cmds:
      - task: _efi
        vars: { OUT: '{{.APP}}-winhandoff', EXTRA_TAGS: ",winhandoff,trustfull" }
      - test/qemu/win-handoff.sh {{.BIN}}/{{.APP}}-winhandoff.efi

  tpmread:
    desc: Build the gnu-efi EFI_TCG2 PCR-reader fixture (bin/tpmread.efi) for measured-boot tests
    vars:
      EFILIB:
        sh: echo "${EFILIB:-/usr/lib}"
      EFIINC:
        sh: echo "${EFIINC:-/usr/include/efi}"
      CFLAGS: -I{{.EFIINC}} -I{{.EFIINC}}/x86_64 -fpic -ffreestanding -fno-stack-protector -fno-strict-aliasing -fshort-wchar -mno-red-zone -Wall
    cmds:
      - mkdir -p {{.BIN}}
      - gcc {{.CFLAGS}} -c test/fixtures/tpmread/tpmread.c -o {{.BIN}}/tpmread.o
      - >-
        ld {{.BIN}}/tpmread.o {{.EFILIB}}/crt0-efi-x86_64.o -nostdlib -znocombreloc
        -T {{.EFILIB}}/elf_x86_64_efi.lds -shared -Bsymbolic -L{{.EFILIB}} -lgnuefi -lefi
        -o {{.BIN}}/tpmread.so
      - >-
        objcopy -j .text -j .sdata -j .data -j .dynamic -j .dynsym
        -j '.rel.*' -j '.rela.*' -j .rel -j .rela -j .reloc
        --target efi-app-x86_64 {{.BIN}}/tpmread.so {{.BIN}}/tpmread.efi
      - echo "built {{.BIN}}/tpmread.efi"

  override-pcr:
    desc: 'ADR-0012 task 5: prove pba-override diverges PCR 7 (builds a TPM-enabled OVMF via build-ovmf-tpm.sh; needs swtpm, sbsign, virt-firmware, gnu-efi)'
    cmds:
      - task: testapp
      - task: tpmread
      - test/qemu/pba-setup.sh {{.BIN}}/testapp.efi
      - task: _efi
        vars: { OUT: '{{.APP}}-overridetest', EXTRA_TAGS: ",overridetest,pbatest,trustbroker" }
      - task: build
      - test/qemu/override-pcr.sh {{.BIN}}/{{.APP}}-overridetest.efi {{.BIN}}/{{.APP}}.efi {{.BIN}}/tpmread.efi

  check-release-policy:
    desc: 'Release gate: fail unless the DEFAULT embedded policy is release-ready (Secure Boot required, SED unlock not skipped, no test-fixture target). release.yml runs this; PR CI does not — the dev default is legitimately not release-ready until real auth lands.'
    cmds:
      - go run ./cmd/release-policy-check internal/policy/policy.json

  test:
    desc: Run host Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet on host packages
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go sources (gofmt -w)
    cmds:
      - gofmt -l -w .

  lint:
    desc: gofmt check + go vet + golangci-lint (installs golangci-lint if missing)
    vars:
      GCL:
        sh: echo "$(go env GOPATH)/bin/golangci-lint"
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
      - go vet ./...
      - |
        if [ ! -x "{{.GCL}}" ]; then
          echo "installing golangci-lint v2.12.2…"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        fi
        "{{.GCL}}" run ./...

  check:
    desc: 'Local CI: lint + host tests + chainload smoke (happy + fail-closed) + Secure Boot matrix'
    cmds:
      - task: lint
      - task: test
      - task: run
      - task: run-negative
      - task: sb-require-test
      - task: pba-matrix
      - task: sb-matrix

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN}}
